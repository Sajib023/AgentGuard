  <text x="746" y="174" fill="#8c96a8" font-size="8.5" text-anchor="middle">Llama Guard 3</text>

  <text x="308" y="212" fill="#dbe0ea" font-size="9.5">Policy Voter → <tspan fill="#00ff88" font-weight="bold">ALLOW</tspan> · <tspan fill="#ffaa00" font-weight="bold">SANITIZE</tspan> · <tspan fill="#b388ff" font-weight="bold">APPROVE (Hold)</tspan> · <tspan fill="#ff3355" font-weight="bold">BLOCK</tspan></text>

  <!-- 5-Stage Threat RAG & GraphRAG Box -->
  <rect x="294" y="236" width="508" height="122" rx="6" fill="#0f141d" stroke="#00e5ff" stroke-opacity="0.55"/>
  <text x="308" y="256" fill="#00e5ff" font-size="11" font-weight="bold">5-STAGE THREAT-RAG &amp; GRAPHRAG LINEAGE ENGINE (/v1/rag/* · /v1/graph/*)</text>
  <text x="308" y="276" fill="#dbe0ea" font-size="9.5">1. Sources: MITRE ATLAS (AML.T0048/T0051/T0054) + OWASP LLM Top 10 (2025) + Custom Policies</text>
  <text x="308" y="293" fill="#dbe0ea" font-size="9.5">2. Variable Semantic Boundary Chunking (cosine-similarity valleys &lt; 0.38, 90..520 chars)</text>
  <text x="308" y="310" fill="#dbe0ea" font-size="9.5">3. Secret Redaction + Anthropic Contextual RAG Prefix prepended prior to embedding</text>
  <text x="308" y="327" fill="#dbe0ea" font-size="9.5">4. Hybrid Retrieval: 45% Dense Vector Cosine + 55% ColBERT Token-Level MaxSim Reranker</text>
  <text x="308" y="344" fill="#00ff88" font-size="9.5">5. GraphRAG KG: (Session) -[READ_SENSITIVE]-&gt; (.env) -[EXFILTRATION_PATH]-&gt; (curl/Sink)</text>

