  <rect x="560" y="550" width="520" height="110" rx="8" fill="#090c12" stroke="#ffaa00" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="576" y="574" fill="#ffaa00" font-size="11" font-weight="bold">5. LOCAL OPEN-WEIGHT MODELS (Ollama · 127.0.0.1:11434)</text>
  <text x="576" y="596" fill="#dbe0ea" font-size="9.5">• <tspan fill="#00ff88" font-weight="bold">llama-guard3:1b</tspan> (Q4_K_M) — Tier-4 semantic hazard classification (S1–S15)</text>
  <text x="576" y="614" fill="#dbe0ea" font-size="9.5">• <tspan fill="#00e5ff" font-weight="bold">qwen2.5:3b</tspan> (Q4_K_M) — Anthropic-style Contextual RAG prefix enrichment</text>
  <text x="576" y="632" fill="#dbe0ea" font-size="9.5">• <tspan fill="#b388ff" font-weight="bold">deepseek-r1:1.5b</tspan> (Q4_K_M) — Chain-of-thought root-cause incident synthesis</text>
  <text x="576" y="650" fill="#dbe0ea" font-size="9.5">• <tspan fill="#ffaa00" font-weight="bold">glm4:9b</tspan> (Q4_0) — GraphRAG entity &amp; tool-resource triple extraction</text>
